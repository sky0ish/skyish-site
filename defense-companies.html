  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f9d92'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='20' font-weight='bold' fill='white' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- 로그인·승인된 사람만 열람 -->
  <script type="module" src="assets/js/guard.js?v=202609010300"></script>
  <style>
    /* 표가 넓어 창을 꽉 채워 씁니다 */
    .dl-wrap{padding-top:calc(76px + 1rem);padding-bottom:2rem}
    .dl-wrap .container--wide{max-width:min(2200px,96vw)}

    .dl-top{position:sticky;top:64px;z-index:60;background:var(--paper);
           padding-top:.4rem;margin-bottom:.7rem}
    .dl-wrap .dl-note{margin-bottom:.7rem}
    .dl-bar{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;
            padding:.7rem .9rem;background:var(--white);border:1px solid var(--line-soft);
            border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
    .dl-bar input[type=search]{flex:1 1 220px;min-width:160px;padding:.42rem .7rem;
            border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit}
    .dl-bar .chip{font-size:.84rem;padding:.3rem .75rem;cursor:pointer}
    .dl-bar .n{color:#8b8280;font-variant-numeric:tabular-nums}
    .dl-bar .chip.active .n{color:rgba(255,255,255,.7)}

    /* 가로 이동 바 — 화면에 붙어 다닙니다 */
    .dl-xbar{display:flex;align-items:center;gap:.4rem;margin-top:.4rem}
    .dl-xbar[hidden]{display:none}
    .dl-xgo{all:unset;cursor:pointer;flex:none;width:26px;height:20px;display:grid;
            place-items:center;border:1px solid var(--line);border-radius:6px;
            background:var(--white);color:#6b6360;font-size:.66rem;box-shadow:var(--shadow-sm)}
    .dl-xgo:hover{border-color:var(--teal);color:var(--teal-text)}
    .dl-xgo:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
    .dl-xgo[disabled]{opacity:.35;cursor:default}
    .dl-xtrack{flex:1;overflow-x:auto;overflow-y:hidden;height:16px;
               background:var(--white);border:1px solid var(--line);
               border-radius:8px;box-shadow:var(--shadow-sm)}
    .dl-xtrack div{height:1px}
    /* 바가 늘 보이게 — 맥에서는 기본으로 숨습니다 */
    .dl-xtrack::-webkit-scrollbar{height:14px}
    .dl-xtrack::-webkit-scrollbar-thumb{background:#c3bcb8;border-radius:7px;
                                        border:3px solid var(--white)}
    .dl-xtrack::-webkit-scrollbar-thumb:hover{background:var(--teal)}
    .dl-xtrack::-webkit-scrollbar-track{background:transparent}
    .dl-xtrack{scrollbar-width:thin}

    .dl-scroll{overflow:auto;max-height:calc(100vh - 240px);
               border:1px solid var(--line);border-radius:var(--radius-md);background:var(--white)}
    .dl-table{border-collapse:separate;border-spacing:0;font-size:.83rem;width:max-content;min-width:100%}
    .dl-table th,.dl-table td{padding:.42rem .6rem;border-bottom:1px solid var(--line-soft);
                              text-align:left;vertical-align:top}
    .dl-table thead th{position:sticky;top:0;z-index:3;background:var(--paper-2);
                       white-space:nowrap;font-weight:600;color:#4a4442;
                       box-shadow:inset 0 -1px 0 var(--line)}
    /* 첫 세 칸(번호·지역·기업명)은 가로로 밀어도 붙어 있게 */
    .dl-table th:nth-child(-n+3),.dl-table td:nth-child(-n+3){position:sticky;background:var(--white)}
    .dl-table thead th:nth-child(-n+3){background:var(--paper-2);z-index:4}
    /* 붙어 있는 첫 세 칸 — 왼쪽 자리는 칸 너비에 따라 JS 가 넣습니다 */
    .dl-table th:nth-child(1),.dl-table td:nth-child(1){left:0;
              text-align:right;color:#8b8280;font-variant-numeric:tabular-nums}
    .dl-table th:nth-child(2),.dl-table td:nth-child(2){left:var(--l2,3.2rem)}
    .dl-table th:nth-child(3),.dl-table td:nth-child(3){left:var(--l3,6.6rem);font-weight:600}
    .dl-table tbody tr:hover td{background:#faf7f4}
    .dl-table td{white-space:normal;line-height:1.45;overflow-wrap:anywhere}
    .dl-table thead th{white-space:nowrap}

    .dl-back{flex:none;font-size:.82rem;color:var(--ink);white-space:nowrap;
             border:1px solid var(--line);border-radius:999px;padding:.28rem .8rem;
             background:var(--white)}
    .dl-back:hover{border-color:var(--ink);background:var(--ink);color:#fff}
    .dl-back:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

    /* 고치기 — 관리자만 */
    .dl-edit{all:unset;cursor:pointer;flex:none;white-space:nowrap;font-size:.82rem;
             color:var(--mauve);background:var(--white);border:1px solid var(--line);
             border-radius:var(--radius-sm);padding:.3rem .7rem;box-shadow:var(--shadow-sm)}
    .dl-edit:hover{border-color:var(--teal);color:var(--teal-text)}
    .dl-edit:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
    .dl-edit.on{background:var(--teal);color:#fff;border-color:var(--teal)}
    body.dl-editing .dl-table td{cursor:text}
    body.dl-editing .dl-table tbody td:hover{outline:1px dashed var(--teal);outline-offset:-1px}
    .dl-table td[contenteditable="true"]{outline:2px solid var(--teal);outline-offset:-2px;
                                         background:#f4faf9;white-space:pre-wrap}
    /* 손으로 고친 칸 — 조사로 채운 칸(점선)과 구별되게 실선으로 */
    .dl-mine{border-bottom:2px solid var(--teal)}
    .dl-mine::after{content:"✎";font-size:.7em;color:var(--teal);vertical-align:super;
                    margin-left:.15em}
    .dl-editmsg{margin:.6rem 0 0;font-size:.86rem;line-height:1.8;white-space:pre-wrap}
    .dl-editmsg.ok{color:var(--teal-text)}
    .dl-editmsg.err{color:#8e3b2c}
    .dl-editmsg[hidden]{display:none}

    .dl-save{all:unset;cursor:pointer;flex:none;margin-left:auto;white-space:nowrap;
             font-size:.82rem;color:var(--teal-text);background:var(--white);
             border:1px solid var(--teal);border-radius:var(--radius-sm);
             padding:.3rem .7rem;box-shadow:var(--shadow-sm)}
    .dl-save:hover{background:var(--teal);color:#fff}
    .dl-save:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
    .dl-save[disabled]{opacity:.45;cursor:default}

    /* 칸 너비 조절 — 머리글 사이를 끕니다 */
    .dl-table{table-layout:fixed}
    .dl-table th{position:relative}
    .dl-grip{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;
             z-index:6;touch-action:none}
    .dl-grip::after{content:"";position:absolute;top:20%;bottom:20%;left:4px;width:1px;
                    background:var(--line);transition:background .12s}
    .dl-grip:hover::after,.dl-grip.on::after{background:var(--teal);width:2px;left:3px}
    .dl-table th:last-child .dl-grip{display:none}
    body.dl-sizing{cursor:col-resize;user-select:none}
    .dl-wreset{all:unset;cursor:pointer;flex:none;font-size:.76rem;color:var(--mauve);
               border:1px solid var(--line);border-radius:6px;padding:.18rem .5rem;
               background:var(--white);white-space:nowrap;box-shadow:var(--shadow-sm)}
    .dl-wreset:hover{border-color:var(--teal);color:var(--teal-text)}
    .dl-wreset:focus-visible{outline:2px solid var(--teal);outline-offset:1px}

    .dl-sort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.25rem;
             font:inherit;color:inherit;white-space:nowrap}
    .dl-sort:hover{color:var(--teal-text)}
    .dl-sort:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
    .dl-sort__a{font-size:.7em;color:#c3bcb8}
    th[aria-sort] .dl-sort{color:var(--teal-text);font-weight:700}
    th[aria-sort] .dl-sort__a{color:var(--teal)}

    /* 비어 있던 칸을 공개 자료로 채운 것 — 눈에 띄게 두어 확인하실 수 있게 */
    .dl-fill{border-bottom:2px dotted var(--teal);cursor:help}
    .dl-fill::after{content:"✚";font-size:.7em;color:var(--teal);vertical-align:super;margin-left:.15em}

    .dl-reg{font-size:.72rem;border-radius:999px;padding:.05rem .45rem;
            background:var(--paper-2);color:#6b6360;white-space:nowrap}
    .dl-yes{color:var(--teal-text);font-weight:700}
    .dl-empty{color:#c3bcb8}
    .dl-note{color:#4a4442;font-size:.9rem;margin:.4rem 0 1rem;max-width:92ch}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main id="main">
    <article class="section dl-wrap">
      <div class="container container--wide">

        <span class="eyebrow">Data Analysis</span>
        <h1 class="fb-title">수도권 방산기업 리스트</h1>
        <p class="dl-note" id="dl-note">자료를 불러오는 중입니다…</p>
        <!-- 찾기줄과 가로 이동 바를 한 덩이로 묶어 화면 위에 붙여 둡니다.
             따로 두면 스크롤할 때 가로 바가 찾기줄 뒤로 숨고,
             페이지 맨 아래에서는 표 밑으로 내려가 버립니다. -->
        <div class="dl-top">
          <div class="dl-bar">
            <!-- 돌아가는 고리를 찾기줄과 한 줄에 둡니다 — 세로 자리를 아낍니다 -->
            <a class="dl-back" href="defense-cluster.html">← 기업체와 연구장비 지도</a>
            <input type="search" id="dl-q" autocomplete="off"
                   placeholder="기업명 · 분야 · 기술 · 소재지로 찾기">
            <span id="dl-tabs"></span>
            <span class="fb-fig__src" id="dl-count"></span>
            <button type="button" class="dl-save" id="dl-save">⤓ 엑셀로 내려받기</button>
            <!-- 아래 둘은 관리자로 들어오셨을 때만 보입니다 -->
            <button type="button" class="dl-edit" id="dl-editmode" hidden>✎ 고치기</button>
            <button type="button" class="dl-edit" id="dl-add" hidden>＋ 기업 추가</button>
          </div>

          <!-- 표가 스무 칸이 넘어 오른쪽이 화면 밖으로 나갑니다.
               표 안쪽 스크롤바는 표 맨 아래에 있어 손이 안 닿습니다. -->
          <div class="dl-xbar" id="dl-xbar" hidden>
            <button type="button" class="dl-xgo" id="dl-xl" data-x="l" title="왼쪽 끝으로">◀</button>
            <div class="dl-xtrack" id="dl-xtrack"><div id="dl-xin"></div></div>
            <button type="button" class="dl-xgo" id="dl-xr" data-x="r" title="오른쪽 끝으로">▶</button>
            <button type="button" class="dl-wreset" id="dl-wreset"
                    title="칸 너비를 처음으로 되돌립니다">칸 너비 되돌리기</button>
          </div>
        </div>

        <div class="dl-scroll">
          <table class="dl-table" id="dl-table">
            <colgroup id="dl-cols"></colgroup>
            <thead><tr id="dl-head"></tr></thead>
            <tbody id="dl-body"></tbody>
          </table>
        </div>
        <p class="dl-editmsg" id="dl-editmsg" hidden></p>

        <p class="placeholder-note" lang="ko" style="margin-top:1.2rem">
          ✎ 대표·담당자 연락처는 이 화면에 담지 않았습니다.
          <span class="dl-fill">이렇게 표시된 칸</span>은 원본 표에 비어 있던 것을
          공개된 자료로 채운 것이니, 쓰시기 전에 확인해 주세요.
        </p>

      </div>
    </article>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/main.js?v=202609111700" defer></script>
  <script src="assets/js/defense-companies.js?v=202609092000" defer></script>
