<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 260" fill="#101820" aria-hidden="true" focusable="false">
  <!-- 서울 스카이라인 실루엣 — 남산·N서울타워 · 63빌딩 · IFC · DDP · 롯데월드타워 -->

