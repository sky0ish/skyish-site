<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>로그인 — Jee-Hyun NAM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f9d92'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='20' font-weight='bold' fill='white' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="../assets/css/style.css?v=202608310330">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="authwrap">
    <div class="authcard">
      <h1>로그인</h1>
      <p class="authlead">
        TRAVEL 기록과 DATA ANALYSIS 자료는 승인된 분만 보실 수 있습니다.
        한 번 로그인하면 계속 유지됩니다.
      </p>

      <form id="form">
        <div class="authfield">
          <label for="email">이메일</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="authfield">
          <label for="pw">비밀번호</label>
          <input id="pw" type="password" autocomplete="current-password" required>
        </div>

        <p class="authkeep">한 번 로그인하면 로그아웃하실 때까지 계속 유지됩니다.</p>

        <button id="submit" class="authbtn" type="submit">로그인</button>
      </form>

      <p id="msg" class="authmsg" hidden></p>

      <p class="authalt">
        아직 계정이 없으신가요? <a href="signup.html">가입 신청</a><br>
        <a href="../index.html">← 홈으로</a>
      </p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="../assets/js/main.js?v=202608310330" defer></script>

  <script type="module">
    import { sb, showMsg, analysisAccess } from "./auth.js";

    const form = document.getElementById("form");
    const msg  = document.getElementById("msg");
    const btn  = document.getElementById("submit");

    /* Supabase 가 돌려주는 영어 오류를 알아볼 수 있는 말로 바꿉니다.
       무엇이 잘못됐고 무엇을 하면 되는지까지 적어 둡니다. */
    function explain(m) {
      m = String(m || "");
      if (/Email not confirmed/i.test(m))
        return "비밀번호는 맞습니다. 다만 이메일 확인이 아직 끝나지 않았습니다 — " +
               "가입하실 때 받은 확인 메일의 링크를 눌러주세요. " +
               "메일이 오지 않았다면 운영자에게 알려주세요.";
      if (/Invalid login credentials/i.test(m))
        return "이메일 또는 비밀번호가 맞지 않습니다.";
      if (/rate limit|too many/i.test(m))
        return "시도가 잦습니다. 잠시 뒤에 다시 해주세요.";
      if (/Failed to fetch|NetworkError/i.test(m))
        return "서버에 닿지 못했습니다. 인터넷 연결을 확인해주세요.";
      return "로그인에 실패했습니다: " + m;
    }

    // 로그인 후 돌아갈 곳 (?next=travel.html)
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "../index.html";
    function goNext() { location.href = next.startsWith("http") ? "../index.html" : next; }

    // 이미 로그인돼 있으면 바로 통과 (승인 전이어도 들여보냅니다)
    (async () => {
      const { state } = await analysisAccess();
      if (state === "ok" || state === "pending") goNext();
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.hidden = true;

      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("pw").value,
      });

      if (error) {
        showMsg(msg, explain(error.message));
        btn.disabled = false;
        return;
      }

      // 로그인이 됐으면 일단 들여보냅니다.
      // 승인이 필요한 화면은 각자 알아서 막으므로, 여기서 붙잡아 둘 이유가 없습니다.
      showMsg(msg, "로그인되었습니다. 이동합니다…", true);
      goNext();
    });
  </script>
</body>
</html>
