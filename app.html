<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>My WAY — 앱</title>

<!-- 홈 화면에 설치되는 앱의 첫 화면입니다.
     폰에서 이 주소를 열고 「홈 화면에 추가」 하면
     아이콘이 생기고, 주소창 없이 앱처럼 뜹니다. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f9d92">
<link rel="apple-touch-icon" href="assets/img/app/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My WAY">
<link rel="icon" href="assets/img/app/icon-192.png">
<link rel="stylesheet" href="assets/css/style.css?v=202609020900">

<style>
  /* 앱 화면만의 옷 — 폰에 맞춰 한 손 거리 안에 큼직하게 */
  body { background: var(--paper, #f6f4f1); }
  .app { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px;
    padding-top: calc(18px + env(safe-area-inset-top)); }
  .app__head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; }
  .app__head h1 { font-size: 1.5rem; margin: 0; color: var(--ink, #1c1a19); }
  .app__head span { font-size: .82rem; color: var(--mauve, #8d8578); }
  .app__reload { margin-left: auto; width: 40px; height: 40px; border: 0;
    border-radius: 50%; background: rgba(45, 42, 38, .72); color: #fff;
    font-size: 1.15rem; line-height: 1; cursor: pointer;
    box-shadow: 0 4px 12px rgba(28, 26, 25, .25); transition: .15s ease; }
  .app__reload:active { transform: rotate(180deg); }
  .app__today { margin: 0 0 14px; font-size: .86rem; color: var(--mauve, #8d8578); }

  /* 큰 단추 둘 — 가장 잦은 일부터 */
  .app__write { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
  .app__write a { display: block; padding: 18px 14px; border-radius: 14px;
    text-align: center; font-weight: 700; font-size: 1.02rem; color: #fff;
    box-shadow: 0 4px 14px rgba(28, 26, 25, .12); }
  .app__write a small { display: block; margin-top: 4px; font-size: .72rem;
    font-weight: 400; opacity: .85; }
  .app__write .w-diary { background: #c98a3f; }
  .app__write .w-sched { background: #4f9d92; }

  /* 달력 — 앱에서는 어두운 유리판을 벗기고 바탕에 바로 얹습니다.
     (첫 화면용 「좁은 화면에서는 감춘다 · 폭 46vw」 규칙만 이겨 냅니다) */
  .hocal--app { display: block !important; width: 100% !important;
    margin: 0 0 14px; box-sizing: border-box;
    background: transparent !important; border: 0 !important;
    box-shadow: none !important; backdrop-filter: none !important;
    padding: 0 0 4px;
    color: var(--ink, #1c1a19); }          /* 달수·요일·숫자는 짙은 글씨로 */
  .hocal--app[hidden] { display: none !important; }
  .hocal--app .hocal__nav { background: rgba(28, 25, 22, .08); color: var(--ink, #1c1a19); }
  /* 날짜 위 요일 줄(일 월 화 … 토)은 차분한 회색으로 */
  .hocal--app .hocal__wd span,
  .hocal--app .hocal__wd span.sun,
  .hocal--app .hocal__wd span.sat { color: #9a9284; }

  /* 달력 칸 속 일정 — 칸이 좁아 박스 속 박스는 답답합니다.
     판 없이, 밝은 바탕에 진회색 글자를 바로 얹습니다. */
  .hocal--app .hoc .hev, .hocal--app .hoc em {
    background: none; color: #4a453e; font-weight: 600; padding: 0 1px;
    font-size: .5rem; line-height: 1.25;
    letter-spacing: -0.06em; }                    /* 자간을 좁혀 더 많이 담습니다 */
  .hocal--app .hoc .hev span { -webkit-line-clamp: 4; }   /* 네 줄까지 */
  .hocal--app .hoc .hev i { width: 3px; height: 3px; margin-top: .3em; }
  .hocal--app .hoc .hev:hover { background: rgba(95, 88, 80, .14); }
  .hocal--app .hoc em.more { background: none; color: #8d8578; opacity: 1; }
  .hocal--app .hoc.has { background: rgba(95, 88, 80, .08); }
  .hocal--app .hoc.now { outline-color: rgba(95, 88, 80, .8); }

  /* 다가오는 일정 목록 — 판은 더 어둡게, 글자는 하얗고 두껍게 */
  .hocal--app .hocal__soon {
    border-top: 0; margin-top: 10px; padding: 10px 12px;
    background: rgba(95, 88, 80, .62);
    border-radius: 12px; }
  @supports (backdrop-filter: blur(1px)) {
    .hocal--app .hocal__soon { background: rgba(95, 88, 80, .55); backdrop-filter: blur(8px); }
  }
  .hocal--app .hocal__soon a { color: #fff; font-weight: 600;
    text-shadow: 0 1px 4px rgba(50, 45, 40, .55); }
  .hocal--app .hocal__none { border-top: 0; padding: 10px 12px;
    background: rgba(95, 88, 80, .5); border-radius: 12px; color: #fff; opacity: 1; }
  .hocal--app .hocal__more { color: var(--teal-text, #2f7d6f); opacity: 1; font-weight: 600; }
  .hocal--app .hocal__gc { background: rgba(95, 88, 80, .58);
    border-color: rgba(255, 255, 255, .6); font-weight: 600;
    text-shadow: 0 1px 4px rgba(50, 45, 40, .55); }

  /* 바로가기 — 처음의 흰 카드로 */
  .app__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .app__grid a { display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 6px 12px; background: #fff; border: 1px solid var(--line, #e5e0d6);
    border-radius: 14px; color: var(--ink, #1c1a19); font-size: .82rem; font-weight: 600;
    transition: .15s ease; }
  .app__grid a:active { transform: translateY(1px); }
  .app__grid a i { font-style: normal; font-size: 1.35rem; line-height: 1; }
  .app__note { margin: 18px 0 0; font-size: .74rem; line-height: 1.7;
    color: var(--mauve, #8d8578); }
</style>
</head>
<body>
<main class="app">
  <div class="app__head"><h1>My WAY…</h1><span>skyish.kr</span>
    <!-- 앱으로 열면 주소창이 없어 새로고침할 길이 없습니다 — 단추로 대신합니다 -->
    <button type="button" class="app__reload" id="apReload" aria-label="새로고침">⟳</button>
  </div>
  <p class="app__today" id="apToday"></p>

  <div class="app__write">
    <a class="w-diary" id="goDiary" href="blog.html?cat=diary">✎ 오늘 일기<small>제목에 오늘 날짜가 저절로</small></a>
    <a class="w-sched" id="goSched" href="blog.html?cat=schedule">📅 일정 쓰기<small>Schedule 새 글</small></a>
  </div>

  <!-- 관리자로 들어와 있으면 이번 달 달력이 폅니다.
       일정 글자를 누르면 그 글로, 날짜를 누르면 그날 일기로 갑니다. -->
  <div id="hocal" class="hocal hocal--app" hidden></div>

  <div class="app__grid">
    <a href="blog.html"><i>📝</i>게시판</a>
    <a href="blog.html?cat=people"><i>👥</i>사람들</a>
    <a href="map.html?g=food"><i>🍚</i>맛집 지도</a>
    <a href="map.html?g=all"><i>🗺️</i>종합 지도</a>
    <a href="contact.html?p=addr"><i>📇</i>주소록</a>
    <a href="index.html"><i>🏠</i>홈페이지</a>
  </div>

  <p class="app__note">
    이 화면을 폰의 홈 화면에 담으시면 앱처럼 쓰실 수 있습니다.<br>
    안드로이드 크롬: ⋮ 메뉴 → <b>홈 화면에 추가</b> ·
    아이폰 사파리: 공유 단추 → <b>홈 화면에 추가</b>
  </p>
</main>

<script type="module">
  // 오늘 날짜 — 「2026.09.01 (월)」
  const W = ["일", "월", "화", "수", "목", "금", "토"];
  const t = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const ymd = `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
  document.getElementById("apToday").textContent =
    `${t.getFullYear()}.${p(t.getMonth() + 1)}.${p(t.getDate())} (${W[t.getDay()]})`;

  // 새로고침 — 시각을 붙여 부르므로 저장돼 있던 옛 화면을 지나칩니다
  document.getElementById("apReload").addEventListener("click", () => {
    location.href = location.pathname + "?r=" + Date.now();
  });

  // 쓰기 단추에 오늘을 실어 줍니다 — 게시판이 받아서 새 글을 엽니다
  document.getElementById("goDiary").href = "blog.html?cat=diary&new=" + ymd;
  document.getElementById("goSched").href = "blog.html?cat=schedule&new=" + ymd;

  // 달력 — 첫 화면 것을 그대로. 관리자가 아니면 스스로 사라집니다.
  import("./assets/js/home-cal.js?v=202609020900")
    .then((m) => m.initHomeCal("hocal"))
    .catch(() => {});
</script>
</body>
</html>
