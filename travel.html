<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel — Jee-Hyun NAM</title>
  <meta name="description" content="Jee-Hyun NAM — 여행 기록과 사진. 도시와 건축을 찾아 떠난 여정.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f9d92'/%3E%3Ctext x='16' y='23' font-family='Arial' font-size='20' font-weight='bold' fill='white' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-hero>
  <div id="site-header"></div>

  <main id="main">
    <header class="page-banner page-banner--map">
      <!-- 세계지도가 배경 레이어로 깔립니다 (방문국에 색점) -->
      <div class="page-banner__media" id="travel-map"></div>
      <div class="container container--wide page-banner__inner">
        <span class="eyebrow" style="color:#d9cfcf">Travel</span>
        <h1>Travel</h1>
        <p>도시와 건축을 찾아 떠난 여정의 기록입니다. 지도의 색점을 누르면 그 나라의 기록으로 이동합니다.</p>
        <ul class="tmap__legend" id="travel-legend"></ul>
      </div>
    </header>

    <section class="section">
      <div class="container container--wide">
        <!-- 게시판은 assets/data/travel.js 를 읽어 자동 생성됩니다 -->
        <div id="travel-board" class="reveal"></div>

        <p class="placeholder-note reveal" lang="ko" style="margin-top:2.4rem">
          ✎ <strong>글쓰기</strong> 버튼을 눌러 제목·날짜·소개를 입력하면 붙여넣을 코드가 만들어집니다.
          그 코드를 <code>assets/data/travel.js</code>에 붙여넣으면 글이 올라갑니다.
          PDF를 첨부하려면 파일을 <code>assets/travel/</code> 폴더에 넣고 파일명을 적어주세요.
          (저에게 “여행 글 올려줘”라고 하셔도 바로 올려드립니다.)
        </p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/data/article-italy.js" defer></script>
  <script src="assets/data/travel.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
