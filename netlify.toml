# Netlify 배포 설정
# - publish 는 저장소 루트 (정적 파일을 그대로 서빙)
# - build 는 content/blog/*.md → assets/data/posts.js 생성만 수행

[build]
  command = "node tools/build-posts.mjs"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Decap CMS 의 GitHub OAuth 흐름 ────────────────────────────
# admin/config.yml 의 base_url + auth_endpoint 와 짝을 이룹니다.
[[redirects]]
  from = "/oauth"
  to = "/.netlify/functions/oauth"
  status = 200

[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200

# ── 소스 디렉터리는 웹에 노출하지 않음 ─────────────────────────
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true

# ── 보안 헤더 ────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
